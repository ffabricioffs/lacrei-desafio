name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Testes com cobertura (saída salva como evidência)
        shell: bash
        run: npm run test:coverage -- --ci --verbose 2>&1 | tee jest-saida.txt

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Resumo dos testes
        if: always()
        shell: bash
        run: |
          {
            echo "### Testes (Jest)"
            echo
            echo "Commit avaliado: \`${GITHUB_SHA::7}\`"
            echo
            echo '```'
            grep -E "^(Tests|Test Suites|Snapshots|Time):" jest-saida.txt || true
            echo '```'
            echo
            echo "Saída completa e relatório de cobertura no artefato **testes-${GITHUB_SHA}**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Anexa saída dos testes e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-${{ github.sha }}
          path: |
            jest-saida.txt
            coverage/
          retention-days: 30

  lighthouse:
    name: Lighthouse (a11y ≥ 90, performance ≥ 80)
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Lighthouse CI (build local de produção, no runner)
        run: npx -y @lhci/cli@0.16.x autorun

      - name: Salva relatórios em arquivo
        if: always()
        run: npx -y @lhci/cli@0.16.x upload --target=filesystem --outputDir=./lighthouse-relatorios

      - name: Resumo do Lighthouse
        if: always()
        run: node scripts/lhci-resumo.mjs ./lighthouse-relatorios "Lighthouse — build de produção no runner do CI (mobile, 3 execuções por página)" .lighthouseci/links.json >> "$GITHUB_STEP_SUMMARY"

      - name: Anexa relatórios do Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-${{ github.sha }}
          path: lighthouse-relatorios/
          retention-days: 30
